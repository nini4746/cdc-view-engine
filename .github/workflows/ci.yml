name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # ReplicaIdentityCheckerIT runs inside the default `test` task and starts
      # a postgres:16 Testcontainer here, where Docker is available.
      - run: ./gradlew test
