# CDC 실시간 구체화 뷰 엔진 - 원커맨드 데모 스택
# docker compose up -d --build 하나로 postgres + kafka + connect(Debezium) + engine 기동.
# 시뮬레이터는 Plan 10에서 추가된다.

services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: demo
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d demo"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  connect:
    image: quay.io/debezium/connect:3.0.0.Final
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: cdcview-connect
      CONFIG_STORAGE_TOPIC: cdcview_connect_configs
      OFFSET_STORAGE_TOPIC: cdcview_connect_offsets
      STATUS_STORAGE_TOPIC: cdcview_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    ports:
      - "8080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_URL: http://connect:8083
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_CDC_HOST: postgres
      POSTGRES_CDC_PORT: 5432
      POSTGRES_DB: demo
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      CDCVIEW_VIEWS_DIR: /app/views
    volumes:
      - ./views:/app/views:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      connect:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: demo
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      SIM_RATE: ${SIM_RATE:-100}
      SIM_SELLERS: ${SIM_SELLERS:-100}
      SIM_SEED: ${SIM_SEED:-}
      SIM_DURATION: ${SIM_DURATION:-0}
    depends_on:
      engine:
        condition: service_healthy
